<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraGo</title>
    <link rel="stylesheet" href="../CSS/commonStyles.css" />
    <link rel="stylesheet" href="../CSS/formStyle.css" />
    <link rel="stylesheet" href="../CSS/signup.css" />
    <link rel="stylesheet" href="../CSS/Normalize.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <div class="light top"></div>
    <div class="light bottom"></div>
    <header>
      <div class="container">
        <div class="logo">
          <a href="">AuraGo</a>
        </div>
        <nav>
          <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="./destinations.html">Destination</a></li>
            <li><a href="./tours.html">Tours</a></li>
            <li><a href="./blogs.html">Blogs</a></li>
            <li><a href="./about.html">About</a></li>
            <li><a href="./contact.html">Contact</a></li>
          </ul>
        </nav>
        <div>
          <a class="custom-btn orange" href="./login.html">LogIn</a>
        </div>
      </div>
    </header>
    <div class="content">
      <div class="container">
        <h1>
          Start Your <span style="color: var(--main-color)">Journey</span>
        </h1>
        <p>
          Create an account to explore the world’s hidden gems and unique
          experiences.
        </p>
        <form>
          <div>
            <label>Full Name</label>
            <input type="text" placeholder="Example One" />
          </div>
          <div>
            <label>Email Address</label>
            <input type="text" placeholder="abc@example.com" />
          </div>
          <div>
            <label>Password</label>
            <input placeholder="••••••••" type="password" />
          </div>
          <div>
            <label>Confirm Password</label>
            <input placeholder="••••••••" type="password" />
          </div>
          <button type="submit" class="custom-btn submit">
            Initialize Login
          </button>
        </form>
        <div class="has-account">
          <div>
            <span></span>
            <p>Or register with</p>
            <span></span>
          </div>
          <div class="links">
            <a class="custom-btn" href=""
              ><i class="fa-brands fa-google google"></i> Google</a
            >
            <a class="custom-btn" href=""
              ><i class="fa-brands fa-facebook"></i> FaceBook</a
            >
          </div>
        </div>
        <div class="signup">
          Already have an account? <a href="./login.html"> Log In</a>
        </div>
      </div>
    </div>
    <!-- Footer -->
    <footer class="light-bg">
      <div class="container">
        <div class="copyright style-2">
          <a class="home" href="../index.html">AuraGo</a>
          <div>
            <a href=""><i class="fas fa-solid fa-globe"></i></a>
            <a href=""><i class="fas fa-regular fa-credit-card"></i></a>
            <a href=""><i class="fas fa-solid fa-shield-halved"></i></a>
          </div>
          <div>
            <a href="">Privacy Policy</a>
            <a href="">Terms of Service</a>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
