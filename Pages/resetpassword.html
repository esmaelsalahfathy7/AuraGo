<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraGo</title>
    <link rel="stylesheet" href="../CSS/commonStyles.css" />
    <link rel="stylesheet" href="../CSS/formStyle.css" />
    <link rel="stylesheet" href="../CSS/resetpassword.css" />
    <link rel="stylesheet" href="../CSS/Normalize.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="container">
        <div class="logo">
          <a href="../index.html">AuraGo</a>
        </div>
        <div>
          <a class="support" href="">Support</a>
        </div>
      </div>
    </header>
    <div class="content">
      <div class="light left"></div>
      <div class="light right"></div>
      <div class="container">
        <div>
          <div class="head">
            <i class="fa-solid fa-asterisk"></i>
            <div>
              <h1>Reset Your Password</h1>
              <p>
                Enter your email address and we'll send you a link to reset your
                password.
              </p>
            </div>
          </div>
          <form>
            <div>
              <label>Email Address</label>
              <div class="input">
                <i class="fa-solid fa-envelope"></i>
                <input type="text" placeholder="example123" />
              </div>
            </div>
            <button type="submit" class="custom-btn submit">
              Send Reset Link
            </button>
          </form>
          <div class="login">
            <i class="fa-solid fa-arrow-left"></i>
            <a href="./login.html"> Back To Login</a>
          </div>
        </div>
      </div>
    </div>
    <!-- Footer -->
    <footer class="light-bg">
      <div class="container">
        <div>&copy; 2026 <span>AuraGo Co.</span> All rights reserved.</div>
      </div>
    </footer>
  </body>
  <script>
    document.querySelector("form .submit").addEventListener("click", (e) => {
      e.preventDefault();
      const correct = /\w+@\w+.(com|net|org)/.test(
        document.querySelector("form input").value,
      );
      if (correct) {
        window.alert("Link Sent To Your Email");
      }
    });
  </script>
</html>
