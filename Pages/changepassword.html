<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraGo</title>
    <link rel="stylesheet" href="../CSS/commonStyles.css" />
    <link rel="stylesheet" href="../CSS/formStyle.css" />
    <link rel="stylesheet" href="../CSS/resetpassword.css" />
    <link rel="stylesheet" href="../CSS/Normalize.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="container">
        <div class="logo">AuraGo</div>
        <div>
          <a class="support" href="">Support</a>
        </div>
      </div>
    </header>
    <div class="content">
      <div class="light left"></div>
      <div class="light right"></div>
      <div class="container">
        <div class="head">
          <div>
            <h1>Secure Your Journey</h1>
            <p>
              Create a strong password to continue your exploration with AuraGo.
            </p>
          </div>
        </div>
        <form>
          <div>
            <label>New Password</label>
            <div class="field">
              <i class="fa-solid fa-lock"></i>

              <input
                name="newPassword"
                type="password"
                placeholder="Min. 8 Characters"
              />
            </div>
          </div>
          <div>
            <label>Conferm Password</label>
            <div class="field">
              <i class="fa-solid fa-lock"></i>

              <input type="password" placeholder="Re-enter password" />
            </div>
          </div>
          <button type="submit" class="custom-btn skyblue submit">
            Change Password
          </button>
        </form>
        <div class="login">
          <i class="fa-solid fa-arrow-left"></i>
          <a href="./login.html"> Back To Login</a>
        </div>
      </div>
    </div>
    <!-- Footer -->
    <footer class="light-bg">
      <div class="container">
        <div>&copy; 2026 <span>AuraGo Co.</span> All rights reserved.</div>
      </div>
    </footer>
  </body>
  <script>
    const form = document.querySelector("form");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const inputs = form.querySelectorAll("input");
      if (inputs[0].value.trim() === "" || inputs[1].value.trim() === "") {
        window.alert("Empty Password");
      } else if (inputs[0].value.trim().length < 8) {
        window.alert("Passwords Must Be More Than 8 Characters");
      } else if (inputs[0].value.trim() !== inputs[1].value.trim()) {
        window.alert("Passwords Don`t Match");
      } else {
        window.alert("Password Changed");
        window.location.href = "./login.html";
      }
    });
  </script>
</html>
